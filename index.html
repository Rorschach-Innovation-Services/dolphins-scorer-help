<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolphins Scorer Help</title>
<style>
  /* Medicoach: black page, off-white buttons, brand red #E13A30 for small accents */
  :root {
    color-scheme: dark;
    --bg: #000000; --surface: #111111; --surface-2: #1c1c1c; --text: #f5f5f2; --muted: #a1a19c;
    --line: #2a2a2a; --accent: #f2f1ec; --accent-ink: #0a0a0a; --accent-soft: #242424; --red: #ec4a3f;
    --mark: #5a1d18; --mark-ink: #ffdcd8; --shadow: 0 1px 2px rgb(0 0 0 / .6), 0 4px 16px rgb(0 0 0 / .5);
    --logo-filter: invert(1); --logo-blend: screen;
  }
  :root { --red: #00a35a; --logo-filter: none; --logo-blend: normal; --logo-h: 110px; --mark: #4a4100; --mark-ink: #fff27a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 2px; }

  header { padding: 48px 16px 20px; text-align: center; }
  .brand { display: inline-flex; flex-direction: column; align-items: center; gap: 10px; }
  .brand img { height: var(--logo-h, 40px); width: auto; filter: var(--logo-filter); mix-blend-mode: var(--logo-blend); }
  .brand span { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
  h1 { margin: 8px 0 6px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.02em; line-height: 1.15; }
  .sub { margin: 0; color: var(--muted); }

  .search-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 10px; }
  .search { max-width: 760px; margin: 0 auto; position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #q { width: 100%; font: inherit; font-size: 17px; padding: 15px 44px 15px 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); box-shadow: var(--shadow); outline: none; }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: var(--surface-2); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: none; color: var(--muted); }
  .chips { max-width: 760px; margin: 12px auto 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { border: 1px solid #3a3a3a; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--text); }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .suggest { max-width: 760px; margin: 10px auto 0; text-align: center; font-size: 13px; color: var(--muted); }
  .suggest button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px; text-decoration: underline; text-underline-offset: 2px; }

  .foot { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 40px; }
  .foot:empty { display: none; }
  main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 64px; }
  .status { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: var(--shadow); outline: none; border-color: var(--accent); }
  .thumb { position: relative; aspect-ratio: 16/9; background: #0a0a0a; overflow: hidden; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgb(0 0 0 / .72); color: #fff; font-size: 12px; padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
  .card:hover .play { opacity: 1; }
  .play span { width: 48px; height: 48px; border-radius: 50%; background: rgb(255 255 255 / .92); display: grid; place-items: center; color: #0a0a0a; }
  .card-body { padding: 12px 14px 14px; }
  .cat { font-size: 12px; color: var(--accent); font-weight: 600; }
  .card h3 { margin: 2px 0 0; font-size: 15px; line-height: 1.3; }
  .card p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  .results { display: flex; flex-direction: column; gap: 14px; }
  .result { display: grid; grid-template-columns: 220px 1fr; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .result .thumb { border-radius: 10px; overflow: hidden; cursor: pointer; align-self: start; }
  .result h3 { margin: 2px 0 4px; font-size: 17px; cursor: pointer; }
  .result h3:hover { color: var(--accent); }
  .result .why { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .moments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .moment { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 14px; }
  .moment:hover { background: var(--surface-2); }
  .ts { flex: none; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  .empty strong { color: var(--text); display: block; font-size: 17px; margin-bottom: 4px; }

  dialog { width: min(1180px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgb(0 0 0 / .35); overflow: hidden; }
  dialog::backdrop { background: rgb(0 0 0 / .78); backdrop-filter: blur(3px); }
  .player { display: grid; grid-template-columns: 1fr 340px; height: min(680px, calc(100vh - 34px)); }
  .stage { background: #000; display: flex; flex-direction: column; min-width: 0; }
  .stage video { flex: 1; width: 100%; min-height: 0; background: #000; }
  .side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .side-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .side-head h2 { margin: 0; font-size: 16px; line-height: 1.3; }
  .side-head .cat { display: block; }
  .x { margin-left: auto; flex: none; border: 0; background: var(--accent); color: var(--accent-ink); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  .side-sum { padding: 10px 16px 0; margin: 0; font-size: 13px; color: var(--muted); }
  .tr-label { padding: 12px 16px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .transcript { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
  .line { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--muted); align-items: baseline; }
  .line:hover { background: var(--surface-2); color: var(--text); }
  .line.now { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--red); }
  .no-tr { padding: 0 16px; font-size: 13px; color: var(--muted); }

  /* Start here: guided paths */
  .section-h { margin: 8px 0 16px; }
  .section-h h2 { margin: 2px 0 4px; font-size: 22px; letter-spacing: -.01em; }
  .section-h p { margin: 0; color: var(--muted); font-size: 14px; max-width: 640px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  .paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; margin-bottom: 44px; }
  .path { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
  .path h3 { margin: 2px 0 4px; font-size: 18px; }
  .path p { margin: 0; color: var(--muted); font-size: 14px; }
  .path-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .play-all { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); padding: 10px 16px; font-weight: 600; cursor: pointer; }
  .play-all:hover { background: #ffffff; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .step { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 8px; cursor: pointer; font-size: 14px; }
  .step:hover { background: var(--surface-2); }
  .num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .done .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .path.wide { grid-column: 1 / -1; }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 6px 22px; }
  .grp { margin: 6px 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .group-h { display: flex; align-items: baseline; gap: 8px; margin: 28px 0 12px; font-size: 16px; }
  .group-h span { font-size: 13px; font-weight: 400; color: var(--muted); }
  .seen { position: absolute; left: 8px; top: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }

  /* Player playlist + up next */
  .pl { border-bottom: 1px solid var(--line); padding: 10px 8px 8px; }
  .pl-head { display: flex; align-items: center; gap: 6px; padding: 0 8px 6px; font-size: 12px; }
  .pl-head b { font-weight: 700; color: var(--text); }
  .pl-head span { color: var(--muted); margin-right: auto; }
  .pl-nav { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
  .pl-nav:disabled { opacity: .4; cursor: default; }
  .pl-list { max-height: 150px; overflow-y: auto; }
  .pl .step { padding: 5px 8px; font-size: 13px; }
  .pl .num { width: 22px; height: 22px; font-size: 11px; }
  .pl .step.cur { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--red); }
  .stage { position: relative; }
  .fs-btn { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; padding: 7px 11px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; cursor: pointer; opacity: .88; transition: opacity .15s; }
  .fs-btn:hover, .fs-btn:focus-visible { opacity: 1; background: #ffffff; }
  .stage:fullscreen { width: 100vw; height: 100vh; }
  .stage:-webkit-full-screen { width: 100vw; height: 100vh; }
  .stage:fullscreen video { max-height: none; }
  .stage:-webkit-full-screen video { max-height: none; }
  .upnext { position: absolute; right: 16px; bottom: 72px; width: min(300px, calc(100% - 32px)); background: rgb(20 20 20 / .94); color: #fff; border-radius: 12px; border: 1px solid #333; padding: 14px; box-shadow: 0 8px 30px rgb(0 0 0 / .4); }
  .upnext small { color: #b9c3d9; }
  .upnext strong { display: block; margin: 2px 0 10px; font-size: 15px; }
  .upnext div { display: flex; gap: 8px; }
  .upnext button { border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
  .upnext .go { background: var(--accent); color: var(--accent-ink); }
  .upnext .no { background: rgb(255 255 255 / .14); color: #fff; }

  @media (max-width: 600px) {
    header { padding-top: 28px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; margin-inline: -16px; padding: 0 16px; scrollbar-width: none; }
    .chip { flex: none; }
    .suggest { display: none; }
  }
  @media (max-width: 860px) {
    .player { grid-template-columns: 1fr; height: auto; max-height: calc(100vh - 34px); }
    .stage video { max-height: 45vh; }
    .side { border-left: 0; border-top: 1px solid var(--line); max-height: 50vh; }
    .result { grid-template-columns: 1fr; }
  }
</style>
</head>

const VIDEOS = [{"path": "Dolphins/Dolphins Scorer Checklist.mp4", "title": "Dolphins scorer checklist", "category": "Dolphins", "summary": "The same simple steps for every Dolphins match: the night before, 45 minutes before the start, setting up in the app, during play, the innings break, the end of the match, and what to do if something goes wrong.", "keywords": "dolphins checklist match day routine night before login score account charge phone power bank support message whatsapp 45 minutes signal squads captains paper score sheet scorebook league division fixture start scoring toss playing xi wicketkeepers unregistered verify player undo bowler change innings break umpire photograph scorebook target sign off close match backup paper five minutes stuck problem fix", "short": "Dolphins scorer checklist", "step": "★", "duration": 80.0, "segments": [{"t": 0.1, "text": "Dolphins Live Scoring"}, {"t": 2.1, "text": "Here's your score checklist, the same simple steps for every match."}, {"t": 6.1, "text": "The night before, log in with your score account and check your match details."}, {"t": 10.1, "text": "Charge your phone and power bank and reply seen to the support message."}, {"t": 14.1, "text": "45 minutes before the start, find a good signal, open the match and confirm both squads and captains."}, {"t": 19.1, "text": "Post that you're logged in and keep a paper score sheet ready, just in case."}, {"t": 23.1, "text": "Here's how that looks in the app."}, {"t": 25.1, "text": "From Match, Open League and choose your division, scroll down to your fixture and tap Start Scoring."}, {"t": 29.1, "text": "On the toss screen, confirm both squads, set who won the toss and their decision, the pitch and the match type and hit Save."}, {"t": 35.1, "text": "Then pick both playing 11s, mark the captains and wicket keepers and choose your openers and opening bowler so the first ball goes in on time."}, {"t": 41.1, "text": "If a player is missing, search for them, then verify them or add them as unregistered so every run lands on the right record."}, {"t": 47.1, "text": "During play, enter every ball as it happens, finish bowler changes before any undo and if you get stuck, post in support."}, {"t": 52.1, "text": "At the innings break, check the total with the umpire, photograph the scorebook for support, add any paper overs and confirm the target."}, {"t": 58.1, "text": "At the end, make sure the total, wickets and overs match the umpires, close the match and send the final scorebook photo to support."}, {"t": 64.1, "text": "If something goes wrong, keep scoring in the app if you can, or switch to paper within 5 minutes."}, {"t": 68.1, "text": "Support logs it, applies the fix and you catch up at the next break."}, {"t": 71.1, "text": "So if you're stuck for 5 minutes, go to paper, post once in support and keep scoring."}, {"t": 76.1, "text": "No match ends until it's signed off."}], "thumb": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAABaKADAAQAAAABAAACgAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICpElDQ19QUk9GSUxFAAEBAAAClGFwcGwCEAAAbW50clJHQiBYWVogB9UABAABAAEAAQABYWNzcEFQUEwAAAAAQVBQTAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMZGVzYwAAARQAAABfY3BydAAAAXQAAAAid3RwdAAAAZgAAAAUclhZWgAAAawAAAAUZ1hZWgAAAcAAAAAUYlhZWgAAAdQAAAAUclRSQwAAAegAAAAOdmNndAAAAfgAAAAwbmRpbgAAAigAAAA+Y2hhZAAAAmgAAAAsYlRSQwAAAegAAAAOZ1RSQwAAAegAAAAOZGVzYwAAAAAAAAAFSERUVgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAdGV4dAAAAABDb3B5cmlnaHQgMjAwNyBBcHBsZSBJbmMuAAAAWFlaIAAAAAAAAPNRAAEAAAABFsxYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9jdXJ2AAAAAAAAAAEB9gAAdmNndAAAAAAAAAABAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAAAEAAAAAAAAAAQAAbmRpbgAAAAAAAAA2AACj1wAAVHsAAEzNAACZmgAAJmYAAA9cAABQDQAAVDkAAfYEAAH2BAAB9gQAAAAAAAAAAHNmMzIAA     if (i % 2 === 0) return esc(part);
    const s = stem(part.toLowerCase().replace(/'/g, ""));
    return terms.some(t => near(s, t)) ? "<mark>" + esc(part) + "</mark>" : esc(part);
  }).join("");
}

const thumb = v => `<div class="thumb">${v.thumb ? `<img src="${v.thumb}" alt="" loading="lazy">` : ""}
  ${watched.has(v.path) ? `<span class="seen">✓ Watched</span>` : ""}
  ${v.duration ? `<span class="dur">${fmt(v.duration)}</span>` : ""}
  <div class="play"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div></div>`;

const excerpt = v => v.summary || (v.fullText.length > 120 ? v.fullText.slice(0, 117).replace(/\s+\S*$/, "") + "…" : v.fullText);

const grid = vs => `<div class="grid">${vs.map(v => `
  <button class="card" data-open="${esc(v.path)}">
    ${thumb(v)}
    <div class="card-body"><div class="cat">${esc(v.category)}</div><h3>${esc(v.title)}</h3>
    ${excerpt(v) ? `<p>${esc(excerpt(v))}</p>` : ""}</div>
  </button>`).join("")}</div>`;

const PLAY_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
const stepRows = (p, curPath) => p.videos.map(byPath).map((v, i) => `
  <li><button class="step${watched.has(v.path) ? " done" : ""}${v.path === curPath ? " cur" : ""}" data-open="${esc(v.path)}" data-path="${p.id}">
    <span class="num">${watched.has(v.path) ? "✓" : (v.step ?? i + 1)}</span>
    <span>${esc(v.short || v.title)}</span>
    <span class="d">${fmt(v.duration)}</span>
  </button></li>`).join("");

function pathCard(p) {
  const vs = p.videos.map(byPath), done = vs.filter(v => watched.has(v.path)).length;
  const total = vs.reduce((a, v) => a + (v.duration || 0), 0);
  const next = vs.find(v => !watched.has(v.path));
  const cta = !done ? "Play all" : next ? `Continue: ${esc(next.short || next.title)}` : "Watch again";
  const steps = p.groups
    ? `<div class="groups">${p.groups.map(g => `<div><h4 class="grp">${esc(g.title)}</h4>
        <ol class="steps">${stepRows({ ...p, videos: g.videos })}</ol></div>`).join("")}</div>`
    : `<ol class="steps">${stepRows(p)}</ol>`;
  return `<article class="path${p.groups ? " wide" : ""}">
    <div><div class="eyebrow">${esc(p.label)}</div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p></div>
    <div class="path-meta"><span>${vs.length} videos · ${Math.max(1, Math.round(total / 60))} min</span>
      <div class="bar" aria-label="${done} of ${vs.length} watched"><i style="width:${100 * done / vs.length}%"></i></div>
      <span>${done}/${vs.length}</span></div>
    <button class="play-all" data-open="${esc((next || vs[0]).path)}" data-path="${p.id}">${PLAY_ICON}${cta}</button>
    ${steps}
  </article>`;
}

function startHere() {
  if (!PATHS.length) return "";
  return `<section>
    <div class="section-h"><div class="eyebrow">${esc(SITE.startEyebrow)}</div><h2>${esc(SITE.startTitle)}</h2>
      <p>${esc(SITE.startIntro)}</p></div>
    <div class="paths">${PATHS.map(pathCard).join("")}</div>
  </section>`;
}

// ---- render ----
const cats = [...new Set(VIDEOS.map(v => v.category))];
let state = { q: "", cat: "" };

function renderChips() {
  $("#chips").innerHTML = ["", ...cats].map(c =>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${c ? esc(c) : "All topics"}</button>`).join("");
}

function render() {
  const { terms, list } = search(state.q, state.cat);
  $("#clear").style.display = state.q ? "block" : "none";
  const n = list.length;
  if (!state.q && state.cat) {
    $("#status").textContent = `${n} tutorial${n === 1 ? "" : "s"} in ${state.cat}`;
    const p = PATHS.find(x => x.category === state.cat);
    $("#out").innerHTML = (p ? `<div class="paths">${pathCard(p)}</div>` : "") + grid(list.map(r => r.v));
    return;
  }
  if (!state.q) {
    $("#status").textContent = "";
    $("#out").innerHTML = startHere() + `
      <div class="section-h"><div class="eyebrow">Library</div><h2>All tutorials</h2>
        <p>${esc(SITE.libraryIntro)}</p></div>
      ${cats.map(c => { const vs = VIDEOS.filter(v => v.category === c);
        return `<h3 class="group-h">${esc(c)} <span>${vs.length} video${vs.length === 1 ? "" : "s"}</span></h3>${grid(vs)}`; }).join("")}`;
    return;
  }
  if (!n) {
    $("#status").textContent = "";
    $("#out").innerHTML = `<div class="empty"><strong>No tutorials match “${esc(state.q)}”</strong>Try a shorter or different word, or browse a topic above.</div>`;
    return;
  }
  $("#status").textContent = `${n} matching tutorial${n === 1 ? "" : "s"}`;
  $("#out").innerHTML = `<div class="results">${list.map(({ v, moments }) => `
    <article class="result">
      <div data-open="${esc(v.path)}">${thumb(v)}</div>
      <div>
        <div class="cat">${esc(v.category)}</div>
        <h3 data-open="${esc(v.path)}">${highlight(v.title, terms)}</h3>
        ${v.summary ? `<p class="why">${highlight(v.summary, terms)}</p>` : ""}
        ${moments.length ? `<ul class="moments">${moments.map(m => `<li><button class="moment" data-open="${esc(v.path)}" data-t="${v.segments[m.i].t}">
          <span class="ts">${fmt(v.segments[m.i].t)}</span><span>${highlight(v.segments[m.i].text, terms)}</span></button></li>`).join("")}</ul>` : ""}
      </div>
    </article>`).join("")}</div>`;
}

// ---- player ----
const dlg = $("#dlg"), pv = $("#pv");
let current = null, playlist = null, upTimer = null;

function renderPlaylist() {
  const box = $("#pl");
  box.hidden = !playlist;
  if (!playlist) return;
  const i = playlist.videos.indexOf(current.path), n = playlist.videos.length;
  box.innerHTML = `<div class="pl-head"><b>${esc(playlist.label)}</b><span>· ${i + 1} of ${n}</span>
      <button class="pl-nav" data-go="-1" ${i === 0 ? "disabled" : ""} aria-label="Previous video">‹ Prev</button>
      <button class="pl-nav" data-go="1" ${i === n - 1 ? "disabled" : ""} aria-label="Next video">Next ›</button></div>
    <ol class="steps pl-list">${stepRows(playlist, current.path)}</ol>`;
  box.querySelector(".cur")?.scrollIntoView({ block: "nearest" });
}

function cancelUpNext() { clearInterval(upTimer); upTimer = null; $("#upnext").hidden = true; }
function showUpNext(next) {
  let s = 3;
  const box = $("#upnext");
  const draw = () => box.innerHTML = `<small>Up next in ${s}s</small><strong>${esc(next.title)}</strong>
    <div><button class="go">${PLAY_ICON} Play now</button><button class="no">Cancel</button></div>`;
  draw(); box.hidden = false;
  box.querySelector(".go").onclick = () => openVideo(next.path, 0, playlist.id);
  box.querySelector(".no").onclick = cancelUpNext;
  upTimer = setInterval(() => {
    if (--s <= 0) return openVideo(next.path, 0, playlist.id);
    box.querySelector("small").textContent = `Up next in ${s}s`;
  }, 1000);
}

function openVideo(path, t = 0, pid) {
  const v = byPath(path); if (!v) return;
  cancelUpNext();
  current = v;
  // Any video that belongs to a learning path plays as part of it.
  playlist = PATHS.find(p => p.id === pid && p.videos.includes(path)) || pathFor(path) || null;
  renderPlaylist();
  const terms = queryTerms(state.q);
  $("#pcat").textContent = v.category;
  $("#ptitle").textContent = v.title;
  $("#psum").textContent = v.summary || "";
  $("#psum").style.display = v.summary ? "" : "none";
  $("#ptr").innerHTML = v.segments.length
    ? v.segments.map((s, i) => `<button class="line" data-i="${i}" data-t="${s.t}"><span class="ts">${fmt(s.t)}</span><span>${highlight(s.text, terms)}</span></button>`).join("")
    : `<p class="no-tr">This video has no spoken narration.</p>`;
  if (pv.dataset.path !== path) { pv.src = src(path); pv.dataset.path = path; }
  const start = () => { pv.currentTime = Math.max(0, t - 0.3); pv.play().catch(() => {}); };
  pv.readyState >= 1 ? start() : pv.addEventListener("loadedmetadata", start, { once: true });
  if (!dlg.open) dlg.showModal();
  history.replaceState(null, "", "#" + new URLSearchParams({ v: path, t: Math.floor(t), ...(playlist ? { p: playlist.id } : {}) }));
}
function closeVideo() { pv.pause(); if (dlg.open) dlg.close(); }
dlg.addEventListener("close", () => {
  pv.pause(); cancelUpNext();
  history.replaceState(null, "", location.pathname + location.search);
  if (!state.q) render(); // refresh progress and watched ticks
});

// Full screen: the whole stage (video + "Up next" card), so playlists keep rolling.
// iPhone Safari can only full-screen the video element itself.
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFullscreen() {
  const stage = $(".stage");
  if (fsEl()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
  else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
  else if (pv.webkitEnterFullscreen) pv.webkitEnterFullscreen();
}
function syncFsButton() {
  const on = !!fsEl();
  $("#fs span").textContent = on ? "Exit full screen" : "Full screen";
  $("#fs").setAttribute("aria-label", on ? "Exit full screen (F)" : "Full screen (F)");
}
$("#fs").onclick = toggleFullscreen;
pv.addEventListener("dblclick", toggleFullscreen);
document.addEventListener("fullscreenchange", syncFsButton);
document.addEventListener("webkitfullscreenchange", syncFsButton);
document.addEventListener("keydown", e => {
  if (dlg.open && (e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleFullscreen(); }
});
dlg.addEventListener("close", () => { if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); });

pv.addEventListener("ended", () => {
  markWatched(current.path); renderPlaylist();
  const i = playlist ? playlist.videos.indexOf(current.path) : -1;
  if (playlist && i < playlist.videos.length - 1) showUpNext(byPath(playlist.videos[i + 1]));
});
pv.addEventListener("play", cancelUpNext);
$("#pl").addEventListener("click", e => {
  const nav = e.target.closest("[data-go]");
  if (nav) return openVideo(playlist.videos[playlist.videos.indexOf(current.path) + +nav.dataset.go], 0, playlist.id);
  const s = e.target.closest("[data-open]");
  if (s) openVideo(s.dataset.open, 0, s.dataset.path);
});
$("#pclose").onclick = closeVideo;
dlg.addEventListener("click", e => { if (e.target === dlg) closeVideo(); });

let lastNow = -1;
pv.addEventListener("timeupdate", () => {
  if (current && pv.duration && pv.currentTime / pv.duration > 0.9) markWatched(current.path);
  if (!current || !current.segments.length) return;
  let i = -1; for (let k = 0; k < current.segments.length; k++) { if (current.segments[k].t <= pv.currentTime + 0.2) i = k; else break; }
  if (i === lastNow) return;
  lastNow = i;
  $("#ptr").querySelectorAll(".line.now").forEach(el => el.classList.remove("now"));
  const el = $("#ptr").querySelector(`[data-i="${i}"]`);
  if (el) { el.classList.add("now"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
});
$("#ptr").addEventListener("click", e => { const b = e.target.closest(".line"); if (b) { pv.currentTime = +b.dataset.t; pv.play().catch(() => {}); } });

// ---- wiring ----
let timer;
$("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); render(); toTop(); }, 80); });
const toTop = () => { const y = $("main").offsetTop - $(".search-wrap").offsetHeight; if (scrollY > y) scrollTo({ top: y }); };
$("#clear").onclick = () => { $("#q").value = ""; state.q = ""; render(); $("#q").focus(); };
$("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; state.cat = state.cat === c.dataset.cat ? "" : c.dataset.cat; renderChips(); render(); });
$("#out").addEventListener("click", e => { const o = e.target.closest("[data-open]"); if (o) openVideo(o.dataset.open, +(o.dataset.t || 0), o.dataset.path); });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q") && !dlg.open) { e.preventDefault(); $("#q").focus(); } });

const SUGGEST = SITE.suggest || [];
$("#suggest").innerHTML = "Try: " + SUGGEST.map(s => `<button data-s="${esc(s)}">${esc(s)}</button>`).join("");
$("#suggest").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) { $("#q").value = b.dataset.s; state.q = b.dataset.s; render(); } });

const topic = new URLSearchParams(location.search).get("topic");
if (topic && cats.includes(topic)) state.cat = topic;
renderChips(); render();
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("v")) openVideo(h.get("v"), +(h.get("t") || 0), h.get("p"));
</script>
</body>
</html>
